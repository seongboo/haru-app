<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e86a33">
<title>하루</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #fbf7f1; --panel: #ffffff; --text: #26211c; --muted: #7a7067;
    --line: #e7dfd4; --accent: #e86a33; --accent-text: #ffffff;
    --mine: #fde3d3; --theirs: #ffffff; --alert: #fff3c4; --danger: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17140f; --panel: #221e18; --text: #f1eae0; --muted: #a2978a;
      --line: #383128; --accent: #f08a55; --accent-text: #1a120b;
      --mine: #5a3220; --theirs: #2a251e; --alert: #4a3f12; --danger: #ffb4ab;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.5 -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }

  header {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 18px; margin: 0; flex: 1; }
  #status { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  #status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  #status.on::before { background: #2e9e5b; }
  #status.off::before { background: var(--danger); }
  .ghost { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 14px; }

  #logwrap { flex: 1; min-height: 0; position: relative; display: flex; }
  #log { flex: 1; overflow-y: auto; padding: 44px 16px 12px; display: flex; flex-direction: column; gap: 8px; }
  #clear { position: absolute; top: 8px; left: 12px; z-index: 2; background: var(--panel);
           border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 13px;
           color: var(--muted); }
  #clear[hidden] { display: none; }
  .day { align-self: center; font-size: 12px; color: var(--muted); margin: 8px 0 2px; }
  .msg { max-width: 85%; padding: 8px 12px; border-radius: 14px; border: 1px solid var(--line);
         white-space: pre-wrap; overflow-wrap: anywhere; background: var(--theirs); align-self: flex-start; }
  .msg.mine { background: var(--mine); align-self: flex-end; border-color: transparent; }
  .msg.alert { background: var(--alert); border-color: transparent; }
  .msg .who { display: block; font-size: 12px; color: var(--muted); margin-bottom: 2px; }
  .msg time { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; text-align: right; }
  #empty { margin: auto; text-align: center; color: var(--muted); padding: 24px; }

  #quick { display: flex; gap: 8px; padding: 8px 16px; overflow-x: auto; border-top: 1px solid var(--line);
           scrollbar-width: none; }
  #quick::-webkit-scrollbar { display: none; }
  #quick button { white-space: nowrap; background: var(--panel); border: 1px solid var(--line);
                  border-radius: 999px; padding: 6px 14px; font-size: 14px; }
  #suggest { display: flex; gap: 8px; padding: 8px 16px 0; overflow-x: auto; scrollbar-width: none; }
  #suggest::-webkit-scrollbar { display: none; }
  #suggest[hidden] { display: none; }
  #suggest span { align-self: center; white-space: nowrap; font-size: 12px; color: var(--muted); }
  #suggest button { white-space: nowrap; background: none; border: 1px solid var(--accent);
                    color: var(--accent); border-radius: 999px; padding: 6px 14px; font-size: 14px; }
  #quick button.back { border-color: transparent; background: none; color: var(--muted); padding: 6px 8px; }
  #quick .where { align-self: center; white-space: nowrap; font-size: 13px; font-weight: 600; padding-right: 2px; }

  #composer { display: flex; gap: 8px; padding: 8px 16px 12px; align-items: flex-end; }
  #composer textarea { flex: 1; resize: none; min-height: 44px; max-height: 140px; padding: 10px 12px;
                       border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
  .primary { background: var(--accent); color: var(--accent-text); border: 0; border-radius: 12px;
             padding: 10px 16px; min-height: 44px; font-weight: 600; }
  .primary:disabled { opacity: .5; }

  #toast { position: fixed; left: 16px; right: 16px; bottom: 90px; margin: auto; max-width: 420px;
           background: var(--text); color: var(--bg); padding: 10px 14px; border-radius: 10px;
           font-size: 14px; display: none; z-index: 5; }

  dialog { border: 0; border-radius: 16px; padding: 0; width: min(92vw, 440px);
           background: var(--panel); color: var(--text); }
  dialog::backdrop { background: rgba(0, 0, 0, .45); }
  dialog form { padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  dialog h2 { margin: 0; font-size: 17px; }
  dialog p { margin: 0; font-size: 13px; color: var(--muted); }
  dialog label { font-size: 13px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
  dialog input, dialog textarea { padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px;
                                  background: var(--bg); color: var(--text); width: 100%; }
  dialog textarea { min-height: 80px; resize: vertical; }
  dialog .row { display: flex; gap: 8px; justify-content: flex-end; }
</style>
</head>
<body>

<header>
  <h1>하루</h1>
  <span id="status">설정 필요</span>
  <button class="ghost" id="open-settings" type="button">설정</button>
</header>

<div id="logwrap">
  <button id="clear" type="button" hidden>화면 지우기</button>
  <main id="log" aria-live="polite"></main>
</div>

<nav id="suggest" aria-label="하루가 제안한 다음 명령" hidden></nav>
<nav id="quick" aria-label="빠른 명령"></nav>

<form id="composer">
  <textarea id="text" rows="1" placeholder="하루에게 보낼 말" aria-label="하루에게 보낼 말" maxlength="2000"></textarea>
  <button class="primary" id="send" type="submit">보내기</button>
</form>

<div id="toast" role="status"></div>

<dialog id="settings">
  <form method="dialog" id="settings-form">
    <h2>설정</h2>
    <p>ntfy 주제 이름은 이 기기의 브라우저에만 저장됩니다. 맥북 <code>.env</code>에 적힌 값과 같아야 합니다.</p>
    <label>알림 주제 (HARU_NTFY_TOPIC)
      <input id="set-notify" autocomplete="off" autocapitalize="off" spellcheck="false" required>
    </label>
    <label>명령 주제 (HARU_NTFY_COMMAND_TOPIC)
      <input id="set-command" autocomplete="off" autocapitalize="off" spellcheck="false" required>
    </label>
    <label>ntfy 서버
      <input id="set-server" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://ntfy.sh">
    </label>
    <button class="ghost" type="button" id="restore">지운 기록 다시 보기</button>
    <div class="row">
      <button class="ghost" type="button" id="settings-cancel">닫기</button>
      <button class="primary" type="submit">저장</button>
    </div>
  </form>
</dialog>

<dialog id="sheet">
  <form method="dialog" id="sheet-form">
    <h2 id="sheet-title"></h2>
    <label><span id="sheet-label"></span>
      <textarea id="sheet-text" maxlength="1500" required></textarea>
    </label>
    <label id="sheet-when-wrap">알릴 날짜·시각
      <input id="sheet-when" type="datetime-local">
    </label>
    <div class="row">
      <button class="ghost" type="button" id="sheet-cancel">취소</button>
      <button class="primary" type="submit">보내기</button>
    </div>
  </form>
</dialog>

<script>
"use strict";
// 하루 휴대폰 화면. 맥북의 하루와는 ntfy로만 이야기한다:
//   보내기 = 명령 주제에 글 올리기,  받기 = 알림 주제와 명령 주제 구독.
// 주제 이름은 이 파일에 없고, 기기의 localStorage에만 저장된다.

const DEFAULT_SERVER = "https://ntfy.sh";
const HISTORY = "12h";           // ntfy.sh가 보관하는 범위 안에서 불러올 과거 기록
const MAX_SHOWN = 300;
const KEY = "haru.settings.v1";
const SUGGEST_SUFFIX = "-suggest";   // 하루가 "다음에 할 만한 명령"을 올리는 주제 (알림 주제 + 이 꼬리)
const CLEAR_KEY = "haru.clearedAt.v1";   // 이 시각(초) 이전의 기록은 화면에 보이지 않는다

const $ = (id) => document.getElementById(id);
const log = $("log"), statusEl = $("status"), textEl = $("text"), sendBtn = $("send");

let settings = loadSettings();
let clearedAt = 0;
try { clearedAt = Number(localStorage.getItem(CLEAR_KEY)) || 0; } catch (e) { /* 0으로 진행 */ }
let suggestion = null;           // {time, items}: 가장 최근 답에 딸린 제안
let source = null;
const seen = new Set();
const messages = [];             // {id, time, topic, title, message}

function loadSettings() {
  try {
    const raw = JSON.parse(localStorage.getItem(KEY) || "null");
    if (raw && raw.notify && raw.command) return raw;
  } catch (e) { /* 저장소를 못 쓰는 환경: 설정 없음으로 진행 */ }
  return null;
}

function saveSettings(value) {
  settings = value;
  try { localStorage.setItem(KEY, JSON.stringify(value)); }
  catch (e) { toast("이 브라우저는 설정을 저장하지 못합니다. 닫으면 다시 입력해야 합니다."); }
}

function server() {
  return ((settings && settings.server) || DEFAULT_SERVER).replace(/\/+$/, "");
}

function setStatus(text, cls) {
  statusEl.textContent = text;
  statusEl.className = cls || "";
}

let toastTimer = 0;
function toast(text) {
  const el = $("toast");
  el.textContent = text;
  el.style.display = "block";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.style.display = "none"; }, 4000);
}

// ---- 받기 ---------------------------------------------------------------

function connect() {
  if (source) { source.close(); source = null; }
  if (!settings) { setStatus("설정 필요", "off"); return; }
  const topics = [settings.notify, settings.command, settings.notify + SUGGEST_SUFFIX]
    .map(encodeURIComponent).join(",");
  setStatus("연결 중…");
  source = new EventSource(`${server()}/${topics}/sse?since=${HISTORY}`);
  source.onopen = () => setStatus("연결됨", "on");
  source.onerror = () => setStatus("연결 끊김, 재시도 중", "off");
  source.onmessage = (event) => {
    let data;
    try { data = JSON.parse(event.data); } catch (e) { return; }
    if (data.event !== "message" || !data.id || seen.has(data.id)) return;
    seen.add(data.id);
    if (data.topic === settings.notify + SUGGEST_SUFFIX) {
      takeSuggestion(data);
      return;
    }
    messages.push(data);
    messages.sort((a, b) => a.time - b.time);
    if (messages.length > MAX_SHOWN) messages.splice(0, messages.length - MAX_SHOWN);
    render();
  };
}

function takeSuggestion(data) {
  if (suggestion && suggestion.time > data.time) return;
  let items = [];
  try { items = JSON.parse(data.message).items; } catch (e) { return; }
  if (!Array.isArray(items)) return;
  items = items.filter((x) => typeof x === "string" && x.trim() && x.length <= 80).slice(0, 3);
  suggestion = { time: data.time, items };
  renderSuggestion();
}

function renderSuggestion() {
  const el = $("suggest");
  el.textContent = "";
  // 제안은 가장 최근 답의 것만 보여 준다: 그 뒤에 내가 새 명령을 보냈으면 낡은 제안이다.
  const stale = !suggestion || !suggestion.items.length || suggestion.time <= clearedAt ||
    messages.some((m) => m.topic === settings.command && m.time > suggestion.time);
  el.hidden = stale;
  if (stale) return;
  const label = document.createElement("span");
  label.textContent = "제안";
  el.append(label);
  for (const item of suggestion.items) {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = item;                       // 글자로만 넣는다
    button.addEventListener("click", async () => {
      el.hidden = true;                              // 두 번 누르는 것을 막는다
      if (!(await send(item))) el.hidden = false;
    });
    el.append(button);
  }
}

function render() {
  const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 80;
  log.textContent = "";
  if (settings) renderSuggestion();
  const shown = messages.filter((m) => m.time > clearedAt);
  $("clear").hidden = !shown.length;
  if (!shown.length) {
    const empty = document.createElement("div");
    empty.id = "empty";
    empty.textContent = clearedAt && messages.length
      ? "화면을 지웠습니다. 새로 주고받는 내용부터 여기에 보입니다."
      : "최근 12시간 기록이 없습니다. 오늘 받은 알림이 있는데도 비어 있다면 " +
        "설정의 주제 이름이 ntfy 앱의 것과 한 글자라도 다른 것입니다.";
    log.append(empty);
    return;
  }
  let lastDay = "";
  for (const m of shown) {
    const when = new Date(m.time * 1000);
    const day = when.toLocaleDateString("ko-KR", { month: "long", day: "numeric", weekday: "short" });
    if (day !== lastDay) {
      const sep = document.createElement("div");
      sep.className = "day";
      sep.textContent = day;
      log.append(sep);
      lastDay = day;
    }
    const mine = m.topic === settings.command;
    const bubble = document.createElement("div");
    bubble.className = "msg" + (mine ? " mine" : "") +
      (!mine && m.title && m.title !== "하루" ? " alert" : "");
    if (!mine && m.title) {
      const who = document.createElement("span");
      who.className = "who";
      who.textContent = m.title;
      bubble.append(who);
    }
    bubble.append(document.createTextNode(m.message || ""));   // 글자로만 넣는다 (HTML 해석 없음)
    const time = document.createElement("time");
    time.textContent = when.toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });
    bubble.append(time);
    log.append(bubble);
  }
  if (atBottom) log.scrollTop = log.scrollHeight;
}

// ---- 보내기 -------------------------------------------------------------

async function send(message) {
  message = message.trim();
  if (!message) return false;
  if (!settings) { $("settings").showModal(); return false; }
  sendBtn.disabled = true;
  try {
    const response = await fetch(server() + "/", {
      method: "POST",
      body: JSON.stringify({ topic: settings.command, message }),
    });
    if (!response.ok) throw new Error("HTTP " + response.status);
    log.scrollTop = log.scrollHeight;
    return true;
  } catch (e) {
    toast("보내지 못했습니다. 인터넷 연결을 확인해 주세요. (" + e.message + ")");
    return false;
  } finally {
    sendBtn.disabled = false;
  }
}

$("composer").addEventListener("submit", async (event) => {
  event.preventDefault();
  if (await send(textEl.value)) { textEl.value = ""; autosize(); }
});

function autosize() {
  textEl.style.height = "auto";
  textEl.style.height = Math.min(textEl.scrollHeight, 140) + "px";
}
textEl.addEventListener("input", autosize);

// ---- 빠른 명령 ----------------------------------------------------------
// 두 단계다: 분류를 누르면 그 줄이 그 분류의 세부 버튼으로 바뀐다.
// 세부 버튼은 문장을 대신 써 줄 뿐이다 (하루 쪽에는 평범한 명령으로 도착한다).
//   send:  누르면 바로 보낼 문장
//   ask:   입력 창의 안내 문구 (있으면 내용을 받아서 build로 문장을 만든다)
//   when:  true면 날짜·시각 선택기도 보여 준다

const todoAt = (phrase) => (text) => `할 일 추가: ${text} — ${phrase}에 알려줘`;
const daily = (tag) => (text) => `오늘 계획에 적어줘: [${tag}] ${text}`;
const vaultNote = (kind) => (text) => `옵시디언에 저장해줘 (${kind}): ${text}`;

const MENU = [
  { name: "할 일 보기", items: [
    { name: "전체 목록", send: "할 일 목록 보여줘" },
    { name: "오늘 알림 있는 것", send: "할 일 목록에서 오늘 알림이 잡힌 것만 시각순으로 보여줘" },
    { name: "알림 없는 것", send: "할 일 목록에서 알림이 없는 것만 보여줘" },
  ]},
  { name: "할 일 추가", items: [
    { name: "알림 없이", ask: "할 일", build: (text) => "할 일 추가: " + text },
    { name: "30분 뒤", ask: "할 일", build: todoAt("30분 뒤") },
    { name: "1시간 뒤", ask: "할 일", build: todoAt("1시간 뒤") },
    { name: "오늘 저녁 6시", ask: "할 일", build: todoAt("오늘 저녁 6시") },
    { name: "내일 아침 9시", ask: "할 일", build: todoAt("내일 아침 9시") },
    { name: "날짜·시각 고르기", ask: "할 일", when: true,
      build: (text, when) => `할 일 추가: ${text} — ${when}에 알려줘` },
  ]},
  { name: "반복 할 일", items: [
    { name: "매일", ask: "언제 무엇을 (예: 밤 11시에 내일 할 일 적기)",
      build: (text) => `매일 반복하는 할 일 추가: ${text}` },
    { name: "평일마다", ask: "언제 무엇을 (예: 아침 9시에 메일 확인)",
      build: (text) => `평일(월~금)마다 반복하는 할 일 추가: ${text}` },
    { name: "매주", ask: "요일, 시각, 할 일 (예: 월요일 9시에 주간 계획 세우기)",
      build: (text) => `매주 반복하는 할 일 추가: ${text}` },
    { name: "매월", ask: "날짜, 시각, 할 일 (예: 25일 10시에 연구비 정산)",
      build: (text) => `매월 반복하는 할 일 추가: ${text}` },
    { name: "반복 그만", ask: "할 일 번호나 이름", build: (text) => `할 일 "${text}"의 반복을 그만해줘` },
  ]},
  { name: "완료 처리", items: [
    { name: "번호로 완료", ask: "할 일 번호 (예: 3)", build: (text) => `할 일 ${text}번 완료 처리해줘` },
    { name: "이름으로 완료", ask: "할 일 이름", build: (text) => `할 일 "${text}" 완료 처리해줘` },
  ]},
  { name: "할 일 고치기", items: [
    { name: "알림 시각 바꾸기", ask: "어느 할 일을 언제로 (예: 운동을 저녁 7시로)",
      build: (text) => `할 일 알림 시각 바꿔줘: ${text}` },
    { name: "알림 없애기", ask: "할 일 번호나 이름", build: (text) => `할 일 "${text}"의 알림을 없애줘` },
    { name: "내용 바꾸기", ask: "어느 할 일을 무엇으로 (예: 2번을 논문 초안 교수님께 보내기로)",
      build: (text) => `할 일 내용 바꿔줘: ${text}` },
    { name: "삭제", ask: "지울 할 일의 번호나 이름", build: (text) => `할 일 "${text}" 삭제해줘` },
  ]},
  { name: "오늘 계획", items: [
    { name: "한 일 기록", ask: "한 일", build: daily("한 일") },
    { name: "할 일 메모", ask: "할 일", build: daily("할 일") },
    { name: "생각·아이디어", ask: "생각이나 아이디어", build: daily("생각") },
    { name: "막힌 점", ask: "막힌 점", build: daily("막힌 점") },
  ]},
  { name: "Obsidian 저장", items: [
    { name: "메모", ask: "메모 내용", build: vaultNote("메모") },
    { name: "아이디어", ask: "아이디어", build: vaultNote("아이디어") },
    { name: "회의 기록", ask: "회의 내용", build: vaultNote("회의 기록") },
    { name: "읽을거리", ask: "제목이나 링크, 한 줄 설명", build: vaultNote("읽을거리") },
  ]},
  { name: "기억·메모", items: [
    { name: "이것 기억해 줘", ask: "기억할 내용 (예: 나는 아침형 인간이야)", build: (text) => "기억해줘: " + text },
    { name: "짧은 메모 남기기", ask: "메모", build: (text) => "메모 추가: " + text },
  ]},
];

const quickEl = $("quick");
let openGroup = null;    // 펼친 분류 (없으면 분류 줄)
let activeItem = null;   // 입력 창을 띄운 세부 버튼

function chip(label, onClick, cls) {
  const button = document.createElement("button");
  button.type = "button";
  button.textContent = label;
  if (cls) button.className = cls;
  button.addEventListener("click", onClick);
  return button;
}

function renderQuick() {
  quickEl.textContent = "";
  if (!openGroup) {
    for (const group of MENU) {
      quickEl.append(chip(group.name, () => { openGroup = group; renderQuick(); }));
    }
  } else {
    quickEl.append(chip("← 뒤로", () => { openGroup = null; renderQuick(); }, "back"));
    const where = document.createElement("span");
    where.className = "where";
    where.textContent = openGroup.name;
    quickEl.append(where);
    for (const item of openGroup.items) {
      quickEl.append(chip(item.ask ? item.name + "…" : item.name, () => pick(item)));
    }
  }
  quickEl.scrollLeft = 0;
}

async function pick(item) {
  if (item.send) {
    if (await send(item.send)) { openGroup = null; renderQuick(); }
    return;
  }
  activeItem = item;
  $("sheet-title").textContent = `${openGroup.name} — ${item.name}`;
  $("sheet-label").textContent = item.ask;
  $("sheet-text").value = "";
  $("sheet-when").value = "";
  $("sheet-when").required = !!item.when;
  $("sheet-when-wrap").style.display = item.when ? "" : "none";
  $("sheet").showModal();
}

$("sheet-cancel").addEventListener("click", () => $("sheet").close());
$("sheet-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  const text = $("sheet-text").value.trim();
  if (!text || !activeItem) return;
  const when = $("sheet-when").value.replace("T", " ");   // "2026-11-24 09:00"
  if (activeItem.when && !when) return;
  const message = activeItem.build(text, when);
  $("sheet").close();
  if (await send(message)) { openGroup = null; renderQuick(); }
});

renderQuick();

// ---- 화면 지우기 (터미널의 clear처럼) -----------------------------------
// 보이는 것만 치운다. ntfy 서버의 기록이나 하루의 할 일·메모는 지워지지 않는다.

function setClearedAt(value) {
  clearedAt = value;
  try { localStorage.setItem(CLEAR_KEY, String(value)); } catch (e) { /* 이번 실행 동안만 유지 */ }
  render();
}
$("clear").addEventListener("click", () => {
  // 기준은 마지막 메시지의 시각(ntfy 서버 시계)이다. 기기 시계를 쓰면 서버와
  // 몇 초 어긋날 때 지운 직후의 새 메시지까지 가려진다.
  if (messages.length) setClearedAt(messages[messages.length - 1].time);
});
$("restore").addEventListener("click", () => {
  setClearedAt(0);
  $("settings").close();
  log.scrollTop = log.scrollHeight;
});

// ---- 설정 ---------------------------------------------------------------

// ntfy 앱에서 복사하면 "ntfy.sh/이름"이나 전체 주소로 붙을 수 있어 이름만 남긴다.
const TOPIC_RE = /^[-_A-Za-z0-9]{1,64}$/;
function cleanTopic(value) {
  return value.trim().replace(/^https?:\/\//i, "").replace(/^[^\/\s]+\//, "").trim();
}

function openSettings() {
  $("set-notify").value = settings ? settings.notify : "";
  $("set-command").value = settings ? settings.command : "";
  $("set-server").value = settings && settings.server ? settings.server : "";
  $("settings").showModal();
}
$("open-settings").addEventListener("click", openSettings);
$("settings-cancel").addEventListener("click", () => $("settings").close());
$("settings-form").addEventListener("submit", (event) => {
  event.preventDefault();
  const notify = cleanTopic($("set-notify").value);
  const command = cleanTopic($("set-command").value);
  const custom = $("set-server").value.trim();
  if (!notify || !command) return;
  if (!TOPIC_RE.test(notify) || !TOPIC_RE.test(command)) {
    toast("주제 이름에는 영문, 숫자, -, _ 만 쓸 수 있습니다. 빈칸이나 다른 글자가 섞였는지 확인해 주세요.");
    return;
  }
  if (notify === command) { toast("알림 주제와 명령 주제는 서로 달라야 합니다."); return; }
  if (custom && !/^https:\/\//.test(custom)) { toast("서버 주소는 https://로 시작해야 합니다."); return; }
  saveSettings({ notify, command, server: custom });
  $("settings").close();
  seen.clear(); messages.length = 0; render();
  connect();
});

// ---- 시작 ---------------------------------------------------------------

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => { /* 설치 기능만 빠진다 */ });
}
document.addEventListener("visibilitychange", () => {
  // 화면으로 돌아왔을 때 연결이 끊겨 있으면 다시 잇는다.
  if (!document.hidden && settings && (!source || source.readyState === 2)) connect();
});
render();
if (settings) connect(); else openSettings();
</script>
</body>
</html>
