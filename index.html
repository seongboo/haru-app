<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e86a33">
<title>하루</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #fbf7f1; --panel: #ffffff; --text: #26211c; --muted: #7a7067;
    --line: #e7dfd4; --accent: #e86a33; --accent-text: #ffffff;
    --mine: #fde3d3; --theirs: #ffffff; --alert: #fff3c4; --danger: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17140f; --panel: #221e18; --text: #f1eae0; --muted: #a2978a;
      --line: #383128; --accent: #f08a55; --accent-text: #1a120b;
      --mine: #5a3220; --theirs: #2a251e; --alert: #4a3f12; --danger: #ffb4ab;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.5 -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }

  header {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 18px; margin: 0; flex: 1; }
  #status { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  #status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  #status.on::before { background: #2e9e5b; }
  #status.off::before { background: var(--danger); }
  .ghost { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 14px; }

  #log { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
  .day { align-self: center; font-size: 12px; color: var(--muted); margin: 8px 0 2px; }
  .msg { max-width: 85%; padding: 8px 12px; border-radius: 14px; border: 1px solid var(--line);
         white-space: pre-wrap; overflow-wrap: anywhere; background: var(--theirs); align-self: flex-start; }
  .msg.mine { background: var(--mine); align-self: flex-end; border-color: transparent; }
  .msg.alert { background: var(--alert); border-color: transparent; }
  .msg .who { display: block; font-size: 12px; color: var(--muted); margin-bottom: 2px; }
  .msg time { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; text-align: right; }
  #empty { margin: auto; text-align: center; color: var(--muted); padding: 24px; }

  #quick { display: flex; gap: 8px; padding: 8px 16px; overflow-x: auto; border-top: 1px solid var(--line);
           scrollbar-width: none; }
  #quick::-webkit-scrollbar { display: none; }
  #quick button { white-space: nowrap; background: var(--panel); border: 1px solid var(--line);
                  border-radius: 999px; padding: 6px 14px; font-size: 14px; }

  #composer { display: flex; gap: 8px; padding: 8px 16px 12px; align-items: flex-end; }
  #composer textarea { flex: 1; resize: none; min-height: 44px; max-height: 140px; padding: 10px 12px;
                       border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
  .primary { background: var(--accent); color: var(--accent-text); border: 0; border-radius: 12px;
             padding: 10px 16px; min-height: 44px; font-weight: 600; }
  .primary:disabled { opacity: .5; }

  #toast { position: fixed; left: 16px; right: 16px; bottom: 90px; margin: auto; max-width: 420px;
           background: var(--text); color: var(--bg); padding: 10px 14px; border-radius: 10px;
           font-size: 14px; display: none; z-index: 5; }

  dialog { border: 0; border-radius: 16px; padding: 0; width: min(92vw, 440px);
           background: var(--panel); color: var(--text); }
  dialog::backdrop { background: rgba(0, 0, 0, .45); }
  dialog form { padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  dialog h2 { margin: 0; font-size: 17px; }
  dialog p { margin: 0; font-size: 13px; color: var(--muted); }
  dialog label { font-size: 13px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
  dialog input, dialog textarea { padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px;
                                  background: var(--bg); color: var(--text); width: 100%; }
  dialog textarea { min-height: 80px; resize: vertical; }
  dialog .row { display: flex; gap: 8px; justify-content: flex-end; }
</style>
</head>
<body>

<header>
  <h1>하루</h1>
  <span id="status">설정 필요</span>
  <button class="ghost" id="open-settings" type="button">설정</button>
</header>

<main id="log" aria-live="polite">
  <div id="empty">아직 기록이 없습니다.<br>아래에서 명령을 보내 보세요.</div>
</main>

<nav id="quick" aria-label="빠른 명령">
  <button type="button" data-quick="list">할 일 목록</button>
  <button type="button" data-quick="todo">할 일 추가</button>
  <button type="button" data-quick="daily">오늘 계획에 적기</button>
  <button type="button" data-quick="vault">Obsidian에 저장</button>
</nav>

<form id="composer">
  <textarea id="text" rows="1" placeholder="하루에게 보낼 말" aria-label="하루에게 보낼 말" maxlength="2000"></textarea>
  <button class="primary" id="send" type="submit">보내기</button>
</form>

<div id="toast" role="status"></div>

<dialog id="settings">
  <form method="dialog" id="settings-form">
    <h2>설정</h2>
    <p>ntfy 주제 이름은 이 기기의 브라우저에만 저장됩니다. 맥북 <code>.env</code>에 적힌 값과 같아야 합니다.</p>
    <label>알림 주제 (HARU_NTFY_TOPIC)
      <input id="set-notify" autocomplete="off" autocapitalize="off" spellcheck="false" required>
    </label>
    <label>명령 주제 (HARU_NTFY_COMMAND_TOPIC)
      <input id="set-command" autocomplete="off" autocapitalize="off" spellcheck="false" required>
    </label>
    <label>ntfy 서버
      <input id="set-server" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://ntfy.sh">
    </label>
    <div class="row">
      <button class="ghost" type="button" id="settings-cancel">닫기</button>
      <button class="primary" type="submit">저장</button>
    </div>
  </form>
</dialog>

<dialog id="sheet">
  <form method="dialog" id="sheet-form">
    <h2 id="sheet-title"></h2>
    <label><span id="sheet-label"></span>
      <textarea id="sheet-text" maxlength="1500" required></textarea>
    </label>
    <label id="sheet-when-wrap">알릴 시각 (선택)
      <input id="sheet-when" type="datetime-local">
    </label>
    <div class="row">
      <button class="ghost" type="button" id="sheet-cancel">취소</button>
      <button class="primary" type="submit">보내기</button>
    </div>
  </form>
</dialog>

<script>
"use strict";
// 하루 휴대폰 화면. 맥북의 하루와는 ntfy로만 이야기한다:
//   보내기 = 명령 주제에 글 올리기,  받기 = 알림 주제와 명령 주제 구독.
// 주제 이름은 이 파일에 없고, 기기의 localStorage에만 저장된다.

const DEFAULT_SERVER = "https://ntfy.sh";
const HISTORY = "12h";           // ntfy.sh가 보관하는 범위 안에서 불러올 과거 기록
const MAX_SHOWN = 300;
const KEY = "haru.settings.v1";

const $ = (id) => document.getElementById(id);
const log = $("log"), statusEl = $("status"), textEl = $("text"), sendBtn = $("send");

let settings = loadSettings();
let source = null;
const seen = new Set();
const messages = [];             // {id, time, topic, title, message}

function loadSettings() {
  try {
    const raw = JSON.parse(localStorage.getItem(KEY) || "null");
    if (raw && raw.notify && raw.command) return raw;
  } catch (e) { /* 저장소를 못 쓰는 환경: 설정 없음으로 진행 */ }
  return null;
}

function saveSettings(value) {
  settings = value;
  try { localStorage.setItem(KEY, JSON.stringify(value)); }
  catch (e) { toast("이 브라우저는 설정을 저장하지 못합니다. 닫으면 다시 입력해야 합니다."); }
}

function server() {
  return ((settings && settings.server) || DEFAULT_SERVER).replace(/\/+$/, "");
}

function setStatus(text, cls) {
  statusEl.textContent = text;
  statusEl.className = cls || "";
}

let toastTimer = 0;
function toast(text) {
  const el = $("toast");
  el.textContent = text;
  el.style.display = "block";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.style.display = "none"; }, 4000);
}

// ---- 받기 ---------------------------------------------------------------

function connect() {
  if (source) { source.close(); source = null; }
  if (!settings) { setStatus("설정 필요", "off"); return; }
  const topics = encodeURIComponent(settings.notify) + "," + encodeURIComponent(settings.command);
  setStatus("연결 중…");
  source = new EventSource(`${server()}/${topics}/sse?since=${HISTORY}`);
  source.onopen = () => setStatus("연결됨", "on");
  source.onerror = () => setStatus("연결 끊김, 재시도 중", "off");
  source.onmessage = (event) => {
    let data;
    try { data = JSON.parse(event.data); } catch (e) { return; }
    if (data.event !== "message" || !data.id || seen.has(data.id)) return;
    seen.add(data.id);
    messages.push(data);
    messages.sort((a, b) => a.time - b.time);
    if (messages.length > MAX_SHOWN) messages.splice(0, messages.length - MAX_SHOWN);
    render();
  };
}

function render() {
  const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 80;
  log.textContent = "";
  if (!messages.length) {
    const empty = document.createElement("div");
    empty.id = "empty";
    empty.textContent = "아직 기록이 없습니다. 아래에서 명령을 보내 보세요.";
    log.append(empty);
    return;
  }
  let lastDay = "";
  for (const m of messages) {
    const when = new Date(m.time * 1000);
    const day = when.toLocaleDateString("ko-KR", { month: "long", day: "numeric", weekday: "short" });
    if (day !== lastDay) {
      const sep = document.createElement("div");
      sep.className = "day";
      sep.textContent = day;
      log.append(sep);
      lastDay = day;
    }
    const mine = m.topic === settings.command;
    const bubble = document.createElement("div");
    bubble.className = "msg" + (mine ? " mine" : "") +
      (!mine && m.title && m.title !== "하루" ? " alert" : "");
    if (!mine && m.title) {
      const who = document.createElement("span");
      who.className = "who";
      who.textContent = m.title;
      bubble.append(who);
    }
    bubble.append(document.createTextNode(m.message || ""));   // 글자로만 넣는다 (HTML 해석 없음)
    const time = document.createElement("time");
    time.textContent = when.toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });
    bubble.append(time);
    log.append(bubble);
  }
  if (atBottom) log.scrollTop = log.scrollHeight;
}

// ---- 보내기 -------------------------------------------------------------

async function send(message) {
  message = message.trim();
  if (!message) return false;
  if (!settings) { $("settings").showModal(); return false; }
  sendBtn.disabled = true;
  try {
    const response = await fetch(server() + "/", {
      method: "POST",
      body: JSON.stringify({ topic: settings.command, message }),
    });
    if (!response.ok) throw new Error("HTTP " + response.status);
    log.scrollTop = log.scrollHeight;
    return true;
  } catch (e) {
    toast("보내지 못했습니다. 인터넷 연결을 확인해 주세요. (" + e.message + ")");
    return false;
  } finally {
    sendBtn.disabled = false;
  }
}

$("composer").addEventListener("submit", async (event) => {
  event.preventDefault();
  if (await send(textEl.value)) { textEl.value = ""; autosize(); }
});

function autosize() {
  textEl.style.height = "auto";
  textEl.style.height = Math.min(textEl.scrollHeight, 140) + "px";
}
textEl.addEventListener("input", autosize);

// ---- 빠른 명령 ----------------------------------------------------------

const QUICK = {
  todo:  { title: "할 일 추가", label: "할 일", when: true,
           build: (text, when) => "할 일 추가: " + text + (when ? ` — ${when}에 알려줘` : "") },
  daily: { title: "오늘 계획에 적기", label: "적을 내용", when: false,
           build: (text) => "오늘 계획에 적어줘: " + text },
  vault: { title: "Obsidian에 저장", label: "노트 내용", when: false,
           build: (text) => "옵시디언에 저장해줘: " + text },
};
let activeQuick = null;

$("quick").addEventListener("click", (event) => {
  const kind = event.target.dataset && event.target.dataset.quick;
  if (!kind) return;
  if (kind === "list") { send("할 일 목록 보여줘"); return; }
  activeQuick = QUICK[kind];
  $("sheet-title").textContent = activeQuick.title;
  $("sheet-label").textContent = activeQuick.label;
  $("sheet-text").value = "";
  $("sheet-when").value = "";
  $("sheet-when-wrap").style.display = activeQuick.when ? "" : "none";
  $("sheet").showModal();
});

$("sheet-cancel").addEventListener("click", () => $("sheet").close());
$("sheet-form").addEventListener("submit", (event) => {
  event.preventDefault();
  const text = $("sheet-text").value.trim();
  if (!text || !activeQuick) return;
  const when = $("sheet-when").value.replace("T", " ");   // "2026-11-24 09:00"
  $("sheet").close();
  send(activeQuick.build(text, when));
});

// ---- 설정 ---------------------------------------------------------------

function openSettings() {
  $("set-notify").value = settings ? settings.notify : "";
  $("set-command").value = settings ? settings.command : "";
  $("set-server").value = settings && settings.server ? settings.server : "";
  $("settings").showModal();
}
$("open-settings").addEventListener("click", openSettings);
$("settings-cancel").addEventListener("click", () => $("settings").close());
$("settings-form").addEventListener("submit", (event) => {
  event.preventDefault();
  const notify = $("set-notify").value.trim();
  const command = $("set-command").value.trim();
  const custom = $("set-server").value.trim();
  if (!notify || !command) return;
  if (notify === command) { toast("알림 주제와 명령 주제는 서로 달라야 합니다."); return; }
  if (custom && !/^https:\/\//.test(custom)) { toast("서버 주소는 https://로 시작해야 합니다."); return; }
  saveSettings({ notify, command, server: custom });
  $("settings").close();
  seen.clear(); messages.length = 0; render();
  connect();
});

// ---- 시작 ---------------------------------------------------------------

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => { /* 설치 기능만 빠진다 */ });
}
document.addEventListener("visibilitychange", () => {
  // 화면으로 돌아왔을 때 연결이 끊겨 있으면 다시 잇는다.
  if (!document.hidden && settings && (!source || source.readyState === 2)) connect();
});
if (settings) connect(); else openSettings();
</script>
</body>
</html>
